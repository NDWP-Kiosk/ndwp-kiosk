name = "north-devon-wakesys-bridge"
main = "worker.js"
compatibility_date = "2026-10-01"

# Create with: npx wrangler kv namespace create OVERRIDES
# then paste the id it prints below.
[[kv_namespaces]]
binding = "OVERRIDES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Staff PIN is a secret, never committed. Set with:
#   npx wrangler secret put STAFF_PIN
