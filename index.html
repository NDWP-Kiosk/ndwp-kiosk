<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>North Devon Wake Park Kiosk</title></head><body>
<div id="kiosk" style="font-family:Arial,sans-serif;background:#f4f5f6;color:#141414;min-height:650px;padding:18px;box-sizing:border-box"><style>#kiosk *{box-sizing:border-box}#kiosk .head{background:#64b6a2;color:white;border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:20px}.brand{font-size:22px;font-weight:800;flex:1}.date{font-size:13px}.next{background:#4b818b;border-radius:12px;padding:10px 16px;min-width:250px}.next small{display:block;font-weight:700;opacity:.8}.next strong{display:block;font-size:22px;margin:3px 0}.next span{font-size:12px}.clock{font-size:18px;font-weight:800;margin-left:10px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}.col{background:white;border:1px solid #e3e4e6;border-radius:12px;padding:10px;overflow:hidden}.col h3{margin:0 0 3px;font-size:14px}.col p{margin:0 0 8px;color:#6b6f73;font-size:10px}.slot{border-radius:9px;padding:9px 10px;margin:6px 0;min-height:55px}.slot.current{background:#f7e8c9;color:#141414;outline:3px solid #d8991f}.slot.available{background:#64b6a2;color:white}.slot.full{background:#4b818b;color:white}.slot.empty{background:#edeef0;color:#6b6f73}.time{font-size:12px;font-weight:800}.detail{font-size:10px;margin-top:3px;display:flex;justify-content:space-between}.current .detail{color:#6b6f73}.legend{font-size:10px;color:#6b6f73;margin-top:8px}.notice{border-radius:9px;padding:9px 10px;margin:6px 0;color:white;font-size:11px}.notice b{display:block;font-size:13px;letter-spacing:.5px}.notice span{display:block;margin-top:3px}.notice.closed{background:#b03a2e}.notice.delayed{background:#d8991f;color:#141414}.col.closed .slot,.col.delayed .slot{opacity:.45}.col.closed .slot.current{outline:none}#parkBanner .notice{font-size:14px;margin:12px 0 0;padding:14px 18px}#parkBanner .notice b{font-size:20px}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.head{flex-wrap:wrap}.next{min-width:0;flex:1}}</style><div class="head"><div class="brand">NORTH DEVON WAKE PARK<div class="date">TODAY'S SESSIONS • LIVE KIOSK APP</div></div><div class="next"><small>NEXT SESSION</small><strong id="nextName">Connecting to WakeSys…</strong><span id="nextSpaces">Loading live availability</span><span class="clock" id="clock">--:--:--</span></div></div><div id="parkBanner"></div><div class="grid" id="grid"></div><div class="legend">⭐ Current session • 🟢 Available • 🟠 Nearly full • 🔵 Full • ⚪ Empty • <span id="connectionStatus">Connecting to WakeSys…</span></div>
<script>(function(){const root=document.getElementById('kiosk');const API='https://northdevonwakepark.wakesys.com/api/events.php';const DISPLAY=['FULL SIZE CABLE','TOP LAKE','AQUA PARK','JUNIOR AQUA PARK','PADDLEBOARDING','SAUNA & DIP'];const WORKER_URL='';const WORKER=(new URLSearchParams(location.search).get('worker')||WORKER_URL).replace(/\/$/,'');const REASONS={'wind':'High wind','lightning':'Lightning','water-quality':'Water quality','other':'Operational'};let liveEvents=[];let overrides={};let callbackNo=0;function setStatus(t,ok){const e=root.querySelector('#connectionStatus');e.textContent=t;e.style.fontWeight='700';e.style.color=ok?'#4b818b':'#b05a3c'}function loadWakeSys(){return new Promise((resolve,reject)=>{const callback='displayEventList_'+Date.now()+'_'+(++callbackNo),script=document.createElement('script');let done=false;const timer=setTimeout(()=>{if(!done){done=true;cleanup();reject(new Error('WakeSys timeout'))}},10000);function cleanup(){clearTimeout(timer);delete window[callback];script.remove()}window[callback]=data=>{if(done)return;done=true;cleanup();const events=Array.isArray(data)?data:(data&&Array.isArray(data.events)?data.events:null);events?resolve(events):reject(new Error('Unexpected WakeSys response'))};script.onerror=()=>{if(!done){done=true;cleanup();reject(new Error('WakeSys network request failed'))}};const now=new Date(),stop=new Date(now.getTime()+86400000);script.src=API+'?callback='+encodeURIComponent(callback)+'&start='+now.toISOString().slice(0,10)+'&stop='+stop.toISOString().slice(0,10)+'&_='+Date.now();document.head.appendChild(script)})}function pick(o,keys){for(const k of keys)if(o&&o[k]!=null&&String(o[k]).trim()!=='')return o[k];return ''}function num(o,keys){for(const k of keys){const n=Number(o&&o[k]);if(Number.isFinite(n))return n}return null}function dt(v){if(!v)return null;const d=new Date(v);return isNaN(d)?null:d}function activity(e){const s=(String(e.resource||e.resourceName||'')+' '+String(e.title||e.name||e.event||e.description||'')).toLowerCase();if(/top\s*lake|ringo/.test(s))return'TOP LAKE';if(/junior|jr.*aqua/.test(s))return'JUNIOR AQUA PARK';if(/aqua\s*park|aquapark/.test(s))return'AQUA PARK';if(/paddle|supstacle|paddleboard/.test(s))return'PADDLEBOARDING';if(/sauna|dip/.test(s))return'SAUNA & DIP';if(/cable|wakeboard|ladies|slow speed|standard speed/.test(s))return'FULL SIZE CABLE';return null}function fmt(d){return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}function notice(o,label){const head=(label?label+' ':'')+(o.status==='closed'?'CLOSED':'DELAYED');const until=o.until&&!isNaN(new Date(o.until))?(o.status==='closed'?'Expected to reopen ':'Expected to start ')+fmt(new Date(o.until)):'';return'<div class="notice '+o.status+'"><b>'+(o.status==='closed'?'⛔ ':'⏳ ')+esc(head)+'</b><span>'+esc(REASONS[o.reason]||'Operational')+(o.note?' • '+esc(o.note):'')+'</span>'+(until?'<span>'+esc(until)+'</span>':'')+'</div>'}async function loadOverrides(){if(!WORKER)return;try{const r=await fetch(WORKER+'/overrides',{cache:'no-store'});const d=await r.json();if(d&&d.ok&&d.overrides){overrides=d.overrides;render()}}catch(e){}}function render(){const groups={};liveEvents.forEach(e=>{const start=dt(pick(e,['start','startTime','start_date','datetime','date']));if(!start)return;const end=dt(pick(e,['end','endTime','end_date','stop','finish'])),name=activity(e);if(!name)return;const cap=num(e,['capacity','max','maxCapacity','limit','places','spaces']),booked=num(e,['booked','bookings','taken','attendees','quantity']);(groups[name]??=[]).push({start,end,title:pick(e,['title','name','event','eventName','description'])||'Session',cap,booked})});const now=new Date(),grid=root.querySelector('#grid');grid.innerHTML='';let next=null;root.querySelector('#parkBanner').innerHTML=overrides.ALL?notice(overrides.ALL,'ALL ACTIVITIES'):'';DISPLAY.forEach(name=>{const own=overrides[name],all=overrides.ALL,ov=own&&all?(all.status==='closed'&&own.status!=='closed'?all:own):own||all;const col=document.createElement('section');col.className='col'+(ov?' '+ov.status:'');col.innerHTML='<h3>'+name+'</h3><p>LIVE • rolling sessions</p>'+(ov?notice(ov):'');const events=(groups[name]||[]).sort((a,b)=>a.start-b.start);let idx=events.findIndex(e=>e.end?e.end>now:e.start>now);if(idx<0)idx=events.findIndex(e=>e.start>now);if(idx<0)idx=events.length;const visible=events.slice(idx,idx+5);if(events[idx]&&!(ov&&ov.status==='closed')&&(!next||events[idx].start<next.start))next={...events[idx],name};if(!visible.length)col.insertAdjacentHTML('beforeend','<div class="slot empty"><div class="time">No more sessions today</div></div>');else visible.forEach((e,i)=>{const left=e.cap!=null&&e.booked!=null?Math.max(0,e.cap-e.booked):null,state=left==null?'empty':left<=0?'full':'available',status=left==null?'LIVE':left<=0?'FULL':left+' LEFT',booked=e.cap!=null&&e.booked!=null?e.booked+' / '+e.cap+' booked':'Live availability',div=document.createElement('div');div.className='slot '+state+(i===0?' current':'');div.innerHTML='<div class="time">'+fmt(e.start)+(e.end?' – '+fmt(e.end):'')+'</div><div class="detail"><span>'+e.title+'</span><strong>'+status+'</strong></div><div style="font-size:9px;margin-top:2px">'+booked+'</div>';col.appendChild(div)});grid.appendChild(col)});if(next){root.querySelector('#nextName').textContent=next.name+' • '+fmt(next.start);root.querySelector('#nextSpaces').textContent=next.cap!=null&&next.booked!=null?Math.max(0,next.cap-next.booked)+' spaces available':'Live availability'}else if(Object.keys(overrides).length){root.querySelector('#nextName').textContent=overrides.ALL&&overrides.ALL.status==='closed'?'ALL ACTIVITIES CLOSED':'No sessions open';root.querySelector('#nextSpaces').textContent=overrides.ALL?REASONS[overrides.ALL.reason]||'':'See notices below'}}function clock(){root.querySelector('#clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}async function refresh(){setStatus('Connecting to WakeSys…',false);try{liveEvents=await loadWakeSys();setStatus('LIVE • '+liveEvents.length+' events received • '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),true);render()}catch(e){setStatus('ERROR • '+e.message,false)}}clock();refresh();loadOverrides();setInterval(clock,1000);setInterval(loadOverrides,15000);setInterval(refresh,60000);setInterval(render,15000)})();</script></div></body></html>
